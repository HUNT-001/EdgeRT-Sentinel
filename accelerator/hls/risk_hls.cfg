# Vitis HLS 2026.1 component config for the RACE risk kernel.
# Run from accelerator/hls (see run_risk_hls.sh / run_risk_hls.bat).
# part: VCK190 (Versal). If it is not in your installed device list, use one that is,
# e.g. xczu7ev-ffvc1156-2-e (ZCU104) or xc7z020clg400-1 (Zynq-7000).
part=xc7a100tcsg324-1

[hls]
flow_target=vivado
package.output.format=rtl
clock=8ns
syn.file=../src/risk_kernel.cpp
syn.file=../src/risk_core.cpp
syn.cflags=-I../include
syn.top=risk_kernel
tb.file=../testbench/tb_risk.cpp
tb.file=../vectors/embedded_vectors.h
tb.cflags=-I../include -I../vectors
csim.code_analyzer=0
cosim.trace_level=none
