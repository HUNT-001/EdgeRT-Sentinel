# Vitis HLS 2026.1 unified-flow component config (run from accelerator/smoke).
# part: VCK190 (Versal). If it is not in your installed device list, swap for
# one that is, e.g. xczu7ev-ffvc1156-2-e (ZCU104) or xc7z020clg400-1 (Zynq-7000).
part=xcvc1902-vsva2197-2MP-e-S

[hls]
flow_target=vivado
package.output.format=rtl
clock=4ns
syn.file=smoke_kernel.cpp
syn.top=smoke_kernel
tb.file=tb_smoke.cpp
csim.code_analyzer=0
cosim.trace_level=none
