[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgert"
version = "0.1.0"
description = "EdgeRT Workbench - host tooling for EdgeRT Sentinel"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["typer>=0.12", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
edgert = "edgert.cli:app"

[tool.setuptools.packages.find]
include = ["edgert*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
